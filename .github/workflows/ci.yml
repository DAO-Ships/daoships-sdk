name: SDK CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: sdk-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # checkout v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # setup-node v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate
      - run: npm run test:adapters
      - if: matrix.node == 24
        run: npm run test:package:registry
      - if: matrix.node == 24
        run: npm audit --audit-level=high
